<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀 마니또 매칭</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
      background-color: #f5f7fb;
      color: #333;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      margin-bottom: 20px;
    }
    h1 { font-size: 22px; text-align: center; color: #2c3e50; margin-top: 0; }
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .locked { background: #ffeaa7; color: #d63031; }
    .unlocked { background: #e8f8f5; color: #2ecc71; }
    
    label { font-size: 14px; font-weight: bold; display: block; margin-top: 14px; margin-bottom: 6px; }
    select, input[type="password"] {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ccd0d5;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 13px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 16px;
    }
    button:hover { background: #2980b9; }

    .my-result {
      margin-top: 20px;
      padding: 18px;
      background: #eef7fe;
      border: 1px solid #b9dcf7;
      border-radius: 10px;
      text-align: center;
      display: none;
    }
    .target-highlight {
      font-size: 24px;
      font-weight: bold;
      color: #1e3799;
      margin: 10px 0;
    }
    .timer-text { font-size: 14px; color: #666; text-align: center; margin-top: 10px; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #e1e8ed;
      padding: 10px;
      text-align: center;
      font-size: 15px;
    }
    th { background: #f1f2f6; font-weight: bold; }
    tr:nth-child(even) { background: #fafbfc; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🎁 마니또 뽑기</h1>
    <div style="text-align: center;">
      <span id="badge" class="status-badge locked">🔒 전체 공개 전 (개별 확인 가능)</span>
    </div>

    <!-- 개별 확인 섹션 -->
    <div id="privateLookupSection">
      <label>내 이름</label>
      <select id="userSelect">
        <option value="">-- 본인 이름을 선택하세요 --</option>
      </select>

      <label>개인 PIN (4자리)</label>
      <input type="password" id="pinInput" placeholder="PIN 입력" maxlength="4">

      <button onclick="revealMyTarget()">내 마니또 상대 확인하기</button>

      <div class="my-result" id="myResultBox">
        <div style="font-size: 14px; color: #555;">내가 선물을 챙겨줄 마니또는:</div>
        <div class="target-highlight" id="targetName"></div>
        <div style="font-size: 12px; color: #888;">⚠️ 화면을 확인한 뒤 창을 닫아주세요.</div>
      </div>

      <div class="timer-text" id="countdownLabel">전체 공개까지 남은 시간: 계산 중...</div>
    </div>

    <!-- 전체 공개 섹션 (지정 날짜 이후 활성화) -->
    <div id="publicTableSection" style="display: none;">
      <div style="text-align: center; margin: 15px 0;">
        <strong style="color: #27ae60; font-size: 16px;">🎉 전체 결과가 공개되었습니다!</strong>
      </div>
      <table>
        <thead>
          <tr>
            <th>선물 주는 사람</th>
            <th>👉</th>
            <th>선물 받는 사람</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    // ================= [사용자 설정 영역] =================
    // 1. 참가자 6명 및 초기 PIN 설정
    const members = [
      { name: "은영", pin: "1111" },
      { name: "서희", pin: "2222" },
      { name: "지수", pin: "3333" },
      { name: "소희", pin: "4444" },
      { name: "혜린", pin: "5555" },
      { name: "수영", pin: "6666" }
    ];

    // 2. 전체 매칭표가 공개될 날짜 및 시각: 10월 4일(일) 16:00
    const REVEAL_DATE_STR = "2026-10-04T16:00:00";

    // 3. 고유 방 키 (모든 기기에서 동일한 고리 매칭을 보장하는 고유 시드)
    const SECRET_ROOM_KEY = "ey-sh-js-sh-hr-sy-manito-seed-2026";
    // =======================================================

    const targetDate = new Date(REVEAL_DATE_STR).getTime();

    // 단일 순환 사이클(A->B->C->...->A) 생성 함수
    function generateSingleCycleMap() {
      let seed = 0;
      for (let i = 0; i < SECRET_ROOM_KEY.length; i++) {
        seed = (seed * 31 + SECRET_ROOM_KEY.charCodeAt(i)) & 0xffffffff;
      }
      function prng() {
        seed = (seed * 1664525 + 1013904223) & 0xffffffff;
        return (seed >>> 0) / 4294967296;
      }

      const names = members.map(m => m.name);
      
      // 순열 셔플
      const order = [...names];
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(prng() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }

      // 단일 고리 연결 (0 -> 1 -> 2 -> 3 -> 4 -> 5 -> 0)
      const matchMap = {};
      for (let i = 0; i < order.length; i++) {
        const giver = order[i];
        const receiver = order[(i + 1) % order.length];
        matchMap[giver] = receiver;
      }

      return matchMap;
    }

    const fullMatchMap = generateSingleCycleMap();

    // 드롭다운 세팅
    const userSelect = document.getElementById("userSelect");
    members.forEach(m => {
      const opt = document.createElement("option");
      opt.value = m.name;
      opt.innerText = m.name;
      userSelect.appendChild(opt);
    });

    // 개별 확인
    function revealMyTarget() {
      const selectedName = userSelect.value;
      const enteredPin = document.getElementById("pinInput").value;
      const resultBox = document.getElementById("myResultBox");
      const targetName = document.getElementById("targetName");

      if (!selectedName) {
        alert("이름을 선택해주세요.");
        return;
      }

      const user = members.find(m => m.name === selectedName);
      if (!user || user.pin !== enteredPin) {
        alert("비밀번호(PIN)가 일치하지 않습니다.");
        resultBox.style.display = "none";
        return;
      }

      targetName.innerText = `🎁 ${fullMatchMap[selectedName]} 님`;
      resultBox.style.display = "block";
    }

    // 전체 결과 렌더링
    function renderPublicTable() {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";
      members.forEach(m => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>${m.name}</strong></td>
          <td style="color:#aaa;">→</td>
          <td><strong style="color:#2980b9;">${fullMatchMap[m.name]}</strong></td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById("badge").className = "status-badge unlocked";
      document.getElementById("badge").innerText = "🔓 전체 공개 완료";
      document.getElementById("publicTableSection").style.display = "block";
      document.getElementById("countdownLabel").style.display = "none";
    }

    // 타이머 체크
    const timer = setInterval(() => {
      const now = new Date().getTime();
      const diff = targetDate - now;

      if (diff <= 0) {
        clearInterval(timer);
        renderPublicTable();
      } else {
        const d = Math.floor(diff / (1000 * 60 * 60 * 24));
        const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((diff % (1000 * 60)) / 1000);
        document.getElementById("countdownLabel").innerText = 
          `전체 결과 공개까지: ${d}일 ${h}시간 ${m}분 ${s}초 남음`;
      }
    }, 1000);
  </script>
</body>
</html>
